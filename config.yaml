# ╔══════════════════════════════════════════════════════════════════════════════════╗
# ║                          VOXCORE — config.yaml                                  ║
# ║                   MASTER CONFIGURATION — ALL SETTINGS LIVE HERE                 ║
# ╚══════════════════════════════════════════════════════════════════════════════════╝
#
# PURPOSE:
#   Single source of truth for all VoxCore configuration. Every module reads
#   its settings from this file at startup via load_config() in main.py.
#   Hot-reloadable via the POST /config API endpoint.
#
# LOADED BY:
#   main.py → load_config() → yaml.safe_load() → passed to all module constructors
#
# SCHEMA:
#   Top-level keys: persona, models, audio, backchannel, memory, agent, safety, server
#   All keys are REQUIRED unless marked (optional).
#
# ═══════════════════════════════════════════════════════════════════════════════════

persona:
  name: "Aria"                       # Display name of the AI persona
  system_prompt: |
    You are Aria, a warm, focused, and capable voice assistant having a real-time spoken conversation.

    VOICE CONTEXT:
    - You are speaking and listening simultaneously in a full-duplex voice call.
    - The user can interrupt you at any time by speaking over you — this is normal and expected.
    - When you are interrupted, respond directly to what the user is now saying. Do NOT acknowledge or comment on the interruption itself (never say things like "oh you interrupted me" or "sorry I got cut off").
    - Keep all spoken responses under 3 sentences unless asked for more. Short, natural replies work best in voice.
    - Start responses with an emotion tag: [cheerful] [calm] [concerned] [excited] [empathetic]
    - Use conversational language — contractions, filler words, and natural phrasing. Avoid bullet points, markdown, or anything that sounds robotic when spoken aloud.

    TOOL USAGE (CRITICAL — follow exactly):
    You have access to tools via <agent> tags. You MUST use them when the user asks for real-time or factual information you don't have.

    WHEN TO USE TOOLS:
    - User asks for current prices, weather, news, scores, stock prices → USE web_search
    - User shares a URL or article link and wants to hear what it says → USE article_fetch
    - User asks a question you can answer from general knowledge → do NOT use tools

    HOW TO USE TOOLS — output this EXACT format (no markdown, no extra text around the tag):
    <agent>{"action": "web_search", "params": {"query": "SEARCH QUERY HERE"}}</agent>
    <agent>{"action": "article_fetch", "params": {"url": "COPY URL FROM USER MESSAGE", "instruction": "WHAT TO DO WITH IT"}}</agent>

    CRITICAL FOR article_fetch: The URL in the params MUST be copied exactly — from the current message OR from earlier in conversation history.
    If NO URL has appeared anywhere in the conversation yet, do NOT call article_fetch — ask them to share the link.

    EXAMPLES:
    User: "What's the bitcoin price right now?"
    You: [calm] Let me look that up for you. <agent>{"action": "web_search", "params": {"query": "bitcoin price today USD"}}</agent>

    User: "How's the weather in Delhi?"
    You: [cheerful] Let me check! <agent>{"action": "web_search", "params": {"query": "weather in Delhi today"}}</agent>

    User: "Can you read this? https://bbc.com/news/tech-article-12345678"
    You: [calm] Sure, pulling that up now. <agent>{"action": "article_fetch", "params": {"url": "https://bbc.com/news/tech-article-12345678", "instruction": "summarize the article naturally in about 150 spoken words"}}</agent>
    (Note: URL was copied exactly from what the user said — not invented)

    [Previous message] User: "Don't check now, I'll ask later — https://www.britannica.com/place/Mars-planet"
    [Current message]  User: "Can you read that article?"
    You: [calm] Sure, let me read that for you! <agent>{"action": "article_fetch", "params": {"url": "https://www.britannica.com/place/Mars-planet", "instruction": "summarize the article naturally in about 150 spoken words"}}</agent>
    (Note: URL came from the previous message — look back in history when user says 'that article', 'the link', 'that URL', etc.)

    User: "Someone sent me a link, can you read it?"
    You: [calm] Sure! Go ahead and share the link and I'll read it for you.
    (Note: No URL anywhere in conversation — do NOT call any tool, just ask for the URL)

    User: "How are you?"
    You: [cheerful] I'm doing great, thanks for asking! How about you?

    RULES:
    - NEVER make up factual information (prices, weather, news). If you don't know, use a tool.
    - When using a tool, say a SHORT acknowledgment BEFORE the <agent> tag (e.g., "Let me check.")
    - CRITICAL: Only call article_fetch if a real URL (starting with http:// or https://) appears in the user's current message OR in recent conversation history. Copy it exactly. Never invent or guess a URL.
    - If someone says they have a link but hasn’t shared it yet, just ask: "Go ahead and share the link!"
    - After a tool result arrives as [TOOL RESULT], speak the answer naturally — do NOT repeat the raw data verbatim.
    - When presenting NEWS results: mention at least 3 different headlines with a brief detail for each. Don't just summarize one item — cover the breadth of what the search returned.
    - If the user asks for "more news" or follow-ups, search with a DIFFERENT query angle (e.g. "world news", "technology news", specific topic) — don't repeat the same query.
    - If the user tells you their name or personal info, just remember it in conversation naturally.
    - NEVER output lines starting with "User:", "You:", "Human:", or "Assistant:" in your response. Your output is ONLY your spoken words. Do NOT simulate conversation history or example dialogues.
  voice: "af_heart"   # Kokoro-ONNX voice ID — see backchannel/generator.py for full list
  language: "en"                     # "en" for English

models:
  stt_primary: "whisper-large-v3-turbo"                          # Groq Whisper — primary STT
  stt_fallback: "https://your-hf-space.hf.space/transcribe"     # HuggingFace faster-whisper endpoint (your own)
  llm_fast: "llama-3.1-8b-instant"                               # Fast brain — all real-time responses
  llm_smart: "meta-llama/llama-4-scout-17b-16e-instruct"        # Smart brain — complex reasoning
  llm_agentic: "moonshotai/kimi-k2-instruct"                    # Agentic brain — tool use
  llm_deep: "qwen/qwen3-32b"                                    # Deep brain — summaries / analysis
  llm_power: "openai/gpt-oss-120b"                              # Power brain — max intelligence (rare)
  llm_monitor: "llama-3.1-8b-instant"                            # V3: Fast classifier for speaking monitor (no thinking prefix)
  tts_model: "models/kokoro-v1.0.onnx"                            # Kokoro-ONNX model file (local)
  tts_voices: "models/voices-v1.0.bin"                            # Kokoro voice embeddings file (local)
  safety: "meta-llama/llama-guard-4-12b"                         # Llama Guard — safety filtering

audio:
  sample_rate: 16000                 # STT input sample rate in Hz (16kHz mono)
  output_sample_rate: 24000          # TTS output sample rate in Hz (Kokoro-ONNX outputs 24kHz)
  chunk_ms: 32                       # VAD chunk size in milliseconds (≥32ms for 16kHz Silero VAD)
  vad_speech_threshold: 0.70         # Silero VAD speech probability threshold (0.0–1.0) — higher = less sensitive
  vad_silence_threshold: 0.6         # Silero VAD silence probability threshold for end-of-turn
  vad_silence_duration_ms: 700       # Milliseconds of silence before end-of-turn is declared
  vad_min_rms_multiplier: 3          # Chunk RMS must exceed noise_floor × this — filters keyboard clicks / throat sounds
  # ── NEW: Anti-sensitivity controls ──
  # vad_speech_confirm_ms: 150          # Must see 150ms of CONSECUTIVE speech frames
                                      # before firing SPEECH_START
                                      # (filters throat clears ~50ms, clicks ~20ms)
  vad_confirm_window: 4              # Look at last 4 frames (~120ms)
  vad_confirm_hits: 2                # 2 of 4 must be speech (50%)
                                     # Natural speech easily hits this
                                     # Single click/breath does NOT
  vad_min_speech_duration_ms: 100     # If total speech segment is shorter than this
                                      # when silence returns, DISCARD it entirely
                                      # (filters isolated "umm" ~200ms, coughs ~150ms)
  noise_floor_calibration_s: 0.5     # Seconds of silence at startup for noise floor calibration
  noise_floor_calibration_s: 0.5     # Seconds of silence at startup for noise floor calibration

# V2/V3: Speaking Monitor — multi-gate interrupt classification during AI speech
speaking_monitor:
  enabled: true                        # Enable/disable the speaking monitor
  model: "llama-3.1-8b-instant"       # LLM model for semantic interrupt classification (Gate 3)
  # ── V3: Two-path Gate 1 ──
  gate1_path_a_min_duration_ms: 150    # Path A: HIGH_ENERGY_BURST — short, loud (shout/command)
  gate1_path_a_energy_ratio: 8         # Path A: 8× noise floor required
  gate1_path_b_min_duration_ms: 750    # Path B: NORMAL_SPEECH — sustained, moderate
                                       # (raised 600→750: echo pops are shorter than speech)
  gate1_path_b_energy_ratio: 4.5       # Path B: 5.0× noise floor required
                                       # (raised 3→5.0: observed echo ceiling=4.6×, observed
                                       #  real-speech floor=5.3×; 5.0 sits in the middle of
                                       #  the 0.7× gap, safely blocking echo without clipping
                                       #  genuine user speech)
  # ── Gate 2/3 ──
  gate2_filler_list: []                # Gate 2: additional filler words
  gate3_debounce_s: 1.5                # Gate 3: min seconds between LLM calls
  gate3_audio_window_ms: 2000          # Gate 3: audio window for transcription
  gate3_timeout_s: 3.0                 # Gate 3: max wait before default INTERRUPT:PAUSE
  context_words: 30                    # Number of recent AI words in classifier prompt
  # ── V3: PENDING state ──
  pre_pause_clip: "hmm.wav"            # Clip to play during PENDING (from clips_dir)
  paused_auto_resume_s: 3.0            # Seconds before PAUSED auto-resumes
  # ── V3: VAD interrupt sensitivity ──
  vad_interrupt_threshold: 0.5         # VAD threshold during SPEAKING (lower = more sensitive)
  vad_interrupt_silence_ms: 300        # Silence before VAD-end action fires

# V3: Echo suppression configuration (4-layer system)
echo_suppression:
  # Layer 2: AriaVoiceFilter (resemblyzer speaker identity)
  aria_similarity_threshold: 0.75      # Cosine similarity above this → echo (0.0-1.0)
  # Layer 3: Gate0EchoCheck (spectral + temporal)
  gate0_spectral_threshold: 0.92       # Spectral cosine similarity above this → echo
                                       # (raised from 0.85 — 6-bin truncation bug caused
                                       #  false positives on user speech; now with 257 bins
                                       #  0.92 is safe and precise)
  gate0_temporal_gate_ms: 400          # TTS played < N ms ago → automatic echo
                                       # (raised 80→400: covers inter-sentence synthesis
                                       #  gaps and room echo tail after each sentence)
  gate0_ema_alpha: 0.1                 # EMA smoothing for TTS spectrum fingerprint
  # Startup warmup
  warmup_text: "Hello, how are you doing today? I hope you're having a wonderful day."

backchannel:
  enabled: true                      # Enable/disable backchannel system entirely
  min_pause_ms: 350                  # Phrase boundary detection: minimum pause in ms
  min_gap_between_s: 8               # Minimum seconds between consecutive backchannels
  min_user_speech_s: 2               # User must speak at least this many seconds before backchannel
  clips_dir: "backchannel/clips/heart/"  # Directory containing pre-generated WAV clips (per-voice subdirectory)
  energy_threshold: 0.02             # RMS energy threshold for phrase boundary detection
  # V2: Emotional reaction clips — played inline during AI speech
  emotional_clips:
    laughs: "laughs.wav"
    chuckles: "chuckles.wav"
    light_laugh: "light_laugh.wav"
    sighs: "sighs.wav"
  clips:                             # List of clip basenames (without .wav) to generate
    - uh_huh
    - yeah
    - i_see
    - go_on
    - interesting
    - right
    - mm_hmm
    - okay
    - sure
    - oh_wow
    - got_it
    - tell_me_more
    - really
    - makes_sense
    - understood

memory:
  short_term_turns: 20               # Number of recent turns to keep in rolling window
  compress_after_turns: 20           # Trigger compression when history exceeds this count
  long_term_enabled: true            # Enable/disable ChromaDB persistent memory
  long_term_db: "./data/memory.db"   # ChromaDB persistent storage path
  retrieval_top_k: 5                 # Number of past memory chunks to retrieve at session start
  embedding_model: "default"         # ChromaDB default embedding or custom model name

agent:
  enabled: true                      # Enable/disable agentic tool execution
  text_out_webhook: null             # (optional) POST URL for agent JSON output
  max_concurrent_tools: 2            # Max tools running in parallel
  tool_timeout_s: 30                 # Timeout for individual tool execution
  tools:                             # List of enabled tool names (must match files in agent/tools/)
    - web_search
    - article_fetch

  web_search:                        # Tool-specific config
    default_num_results: 5
    search_depth: "basic"

  article_fetch:                     # Tool-specific config
    fetch_timeout_seconds: 10
    max_article_words: 8000
    long_article_threshold: 3000
    summary_model: "meta-llama/llama-4-scout-17b-16e-instruct"  # 30K TPM — 5× more headroom than 8b-instant
    long_article_model: "moonshotai/kimi-k2-instruct"           # 10K TPM — good for long analysis
    fallback_models:                                             # Tried in order when primary hits 429
      - "moonshotai/kimi-k2-instruct"
      - "llama-3.3-70b-versatile"
      - "meta-llama/llama-4-maverick-17b-128e-instruct"
    default_summary_max_words: 150

safety:
  enabled: true                      # Enable/disable Llama Guard safety layer
  check_input: true                  # Run safety check on user input
  check_output: true                 # Run safety check on LLM output before TTS
  unsafe_response: "I'm not able to help with that. Let's talk about something else."
  log_incidents: true                # Log safety violations to file

server:
  host: "0.0.0.0"                    # Server bind host
  port: 8000                         # Server bind port
  websocket_enabled: true            # Enable WebSocket server for remote clients
  cors_origins:                      # Allowed CORS origins for web clients
    - "http://localhost:3000"
    - "http://localhost:5173"
